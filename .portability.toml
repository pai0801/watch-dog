# .portability.toml — rules/09-PORTABILITY (upgraded: script-entry + grep-able touchpoints)
# watch-dog
[machine_local]
files = [".env"]

[secrets]
worker = []
python_env = ["CLOUDFLARE_API_TOKEN"]

[bootstrap]
script = "./scripts/bootstrap.sh"
requires = ["node>=20", "wrangler-cli"]

[verify]
script = "./scripts/portability-smoke.sh"
fresh_clone_smoke = "npm run dev → curl /health"

[vendor_lock]
level = "low"
touchpoints = ["DurableObjectNamespace", "c.env.DB", "env.DB"]
