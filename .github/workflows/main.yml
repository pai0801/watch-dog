name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: make install

      - name: Secrets Baseline Freshness (detect-secrets)
        run: |
          python3 -m pip install --user detect-secrets==1.5.0 --quiet
          python3 -m detect_secrets scan --baseline .secrets.baseline

      - name: Lint & Test (make ci)
        run: make ci

      - name: Run Backup
        if: success()
        run: . /etc/default/ci-backup && python3 /usr/local/bin/backup_all_repos.py

      - name: Cleanup Workspace
        if: always()
        run: |
          make clean 2>/dev/null || true
          # Self-hosted runner: workspace is re-cloned each run.
          # Fail-safe enforces the disk limit even if make clean fails.
          rm -rf ./* ./.[!.]* 2>/dev/null || true
